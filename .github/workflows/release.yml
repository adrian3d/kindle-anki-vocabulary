name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier que l'étiquette correspond à la version du plugin
        run: |
          version=$(python -c "import re; print('.'.join(re.search(r'version = \((\d+), (\d+), (\d+)\)', open('plugin/__init__.py').read()).groups()))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $version déclarée dans plugin/__init__.py"
            exit 1
          fi

      - name: Tests
        run: |
          pip install pytest anki
          pytest -q -p no:cacheprovider tests

      - name: Construire le fichier installable
        run: |
          cd plugin
          zip -r "../kindle-vocab-anki-$GITHUB_REF_NAME.zip" . -x '__pycache__/*' '*.pyc'

      - name: Extraire les notes de version du changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { inside = ($2 == tag) ; next }
            inside { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "kindle-vocab-anki-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" "${notes[@]}"
